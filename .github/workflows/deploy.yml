name: Deploy to Cloudflare

# Builds the Worker and uploads it on every push to the live branches, and on
# demand from the Actions tab. This replaces Cloudflare's own Git integration
# (Workers Builds), which needs the Cloudflare GitHub App connected to the
# repository; this workflow only needs two repository secrets:
#
#   CLOUDFLARE_API_TOKEN   an API token with the "Edit Cloudflare Workers"
#                          template permissions
#   CLOUDFLARE_ACCOUNT_ID  from the Workers & Pages overview page
#
# Any of these secrets that are also set on the repository are copied to the
# Worker after each deploy, so the site's settings live in one place
# (ANTHROPIC_API_KEY is only for scrape normalization; the Ask panel does not
# call a model):
#   ANTHROPIC_API_KEY, ADMIN_SECRET, NEXT_PUBLIC_SUPABASE_URL,
#   NEXT_PUBLIC_SUPABASE_ANON_KEY, SUPABASE_SERVICE_ROLE_KEY

on:
  push:
    branches:
      - main
      - claude/pleasanton-events-hub-dvwuym
  workflow_dispatch: {}

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check Cloudflare credentials
        run: |
          # Name each missing secret rather than failing on both together: the
          # usual cause is one typo, or a secret saved under Environments or
          # Dependabot, where `secrets.*` in this job cannot see it.
          missing=""
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            missing="$missing CLOUDFLARE_API_TOKEN"
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            missing="$missing CLOUDFLARE_ACCOUNT_ID"
          fi
          if [ -n "$missing" ]; then
            echo "::error::Missing or empty repository secret(s):$missing — add under Settings → Secrets and variables → Actions → *Repository secrets* (an Environment or Dependabot secret is not visible here). Names are case-sensitive and must match exactly."
            exit 1
          fi
          # Lengths only, never the values, so a truncated paste is visible in
          # the log without the secret being in it. Expect roughly 40 and 32.
          echo "Credentials present: token ${#CLOUDFLARE_API_TOKEN} chars, account id ${#CLOUDFLARE_ACCOUNT_ID} chars."

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # A red check blocks the deploy: nothing below runs when any of these
      # fails. `next build` would catch type errors on its own, but not a
      # failing test, and lint had never run at all before this gate.
      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build the Worker
        run: npm run build

      - name: Deploy
        run: npx wrangler deploy

      - name: Sync secrets to the Worker
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          for name in ANTHROPIC_API_KEY ADMIN_SECRET NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY SUPABASE_SERVICE_ROLE_KEY; do
            value="${!name}"
            if [ -n "$value" ]; then
              printf '%s' "$value" | npx wrangler secret put "$name"
              echo "set $name"
            else
              echo "skip $name (no repository secret)"
            fi
          done
