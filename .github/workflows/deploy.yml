name: Deploy to Cloudflare

# Builds the Worker and uploads it on every push to the live branches, and on
# demand from the Actions tab. This replaces Cloudflare's own Git integration
# (Workers Builds), which needs the Cloudflare GitHub App connected to the
# repository; this workflow only needs two repository secrets:
#
#   CLOUDFLARE_API_TOKEN   an API token with the "Edit Cloudflare Workers"
#                          template permissions
#   CLOUDFLARE_ACCOUNT_ID  from the Workers & Pages overview page
#
# Any of these secrets that are also set on the repository are copied to the
# Worker after each deploy, so the site's settings live in one place
# (ANTHROPIC_API_KEY is only for scrape normalization; the Ask panel does not
# call a model):
#   ANTHROPIC_API_KEY, ADMIN_SECRET, NEXT_PUBLIC_SUPABASE_URL,
#   NEXT_PUBLIC_SUPABASE_ANON_KEY, SUPABASE_SERVICE_ROLE_KEY

on:
  push:
    branches:
      - main
      - claude/pleasanton-events-hub-dvwuym
  workflow_dispatch: {}

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check Cloudflare credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as repository secrets (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build the Worker
        run: npm run build

      - name: Deploy
        run: npx wrangler deploy

      - name: Sync secrets to the Worker
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          for name in ANTHROPIC_API_KEY ADMIN_SECRET NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY SUPABASE_SERVICE_ROLE_KEY; do
            value="${!name}"
            if [ -n "$value" ]; then
              printf '%s' "$value" | npx wrangler secret put "$name"
              echo "set $name"
            else
              echo "skip $name (no repository secret)"
            fi
          done
